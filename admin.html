<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Legaid Amine</title>
<link rel="stylesheet" href="css/style.css">
<style>
.admin-wrap{min-height:100vh;background:#0c1a15;color:#efe6d3;padding:90px 0 60px}
.acard{width:min(1100px,94vw);margin:0 auto;background:#12241e;border:1px solid rgba(239,230,211,.15);border-radius:28px;overflow:hidden}
.ahead{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.2rem 1.4rem;border-bottom:1px solid rgba(239,230,211,.12);flex-wrap:wrap}
.ahead a{color:#efe6d3;text-decoration:none;font-weight:700}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;padding:1rem 1.4rem 0}
.tabs button{border:1px solid rgba(239,230,211,.2);background:transparent;color:#efe6d3;padding:.6rem 1rem;border-radius:999px;font-weight:800;cursor:pointer}
.tabs button.on{background:#c9a24b;color:#1a1405;border-color:#c9a24b}
.abody{padding:1.4rem;display:grid;gap:1rem}
.field{display:grid;gap:.35rem}
.field label{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:800}
.field input,.field textarea,.field select{background:#0c1a15;border:1px solid rgba(239,230,211,.22);color:#efe6d3;border-radius:14px;padding:.8rem 1rem;font-size:.95rem;width:100%}
.field textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.prow-admin{display:flex;justify-content:space-between;align-items:center;gap:.8rem;border:1px solid rgba(239,230,211,.15);border-radius:16px;padding:.8rem 1rem}
.prow-admin img{width:64px;height:64px;object-fit:cover;border-radius:14px}
.abtns{display:flex;gap:.6rem;flex-wrap:wrap}
.btn-a{background:#c9a24b;color:#1a1405;border:none;padding:.8rem 1.2rem;border-radius:999px;font-weight:800;cursor:pointer}
.btn-b{border:1px solid rgba(239,230,211,.3);background:transparent;color:#efe6d3;padding:.8rem 1.2rem;border-radius:999px;font-weight:800;cursor:pointer}
.btn-danger{background:#7a2b2b;color:#fff;border:none;padding:.6rem 1rem;border-radius:999px;cursor:pointer;font-weight:800}
#login{width:min(440px,92vw);margin:12vh auto;background:#12241e;border:1px solid rgba(239,230,211,.15);border-radius:28px;padding:2rem;text-align:center;color:#efe6d3}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#c9a24b;color:#1a1405;font-weight:800;padding:.8rem 1.4rem;border-radius:999px;display:none;z-index:99}
.colors{display:flex;gap:1rem;flex-wrap:wrap}
.colors label{display:grid;gap:.3rem;font-size:.75rem;font-weight:800}
.colors input{width:64px;height:44px;border:none;border-radius:12px;background:none;padding:0}
.hidden{display:none!important}
small.hint{opacity:.6}
</style>
</head>
<body>
<div id="toast"></div>

<div id="login">
  <div class="monogram" style="margin:0 auto 1rem;width:56px;height:56px;display:grid;place-items:center">LA</div>
  <h2 class="serif">Admin Legaid Amine</h2>
  <p style="opacity:.7">Gérez tout le site : vidéo, projets, textes FR/AR, contact, carte, couleurs.</p>
  <div class="field" style="text-align:left;margin:1rem 0"><label>Mot de passe</label><input type="password" id="pwd" placeholder="••••••••"></div>
  <button class="btn-a" id="loginBtn" style="width:100%">Entrer →</button>
  <p><small class="hint">Défaut : amine2026 (changeable dans Sécurité)</small></p>
  <p><a href="index.html" style="color:#c9a24b">← Retour au site</a></p>
</div>

<div class="admin-wrap hidden" id="panel">
<div class="acard">
  <div class="ahead">
    <b class="serif" style="font-size:1.3rem">⚙ Panneau Admin — <span id="sName">Legaid Amine</span></b>
    <div class="abtns">
      <a href="index.html" target="_blank">👁 Voir le site</a>
      <button class="btn-b" id="exportBtn">⬇ Export</button>
      <button class="btn-b" id="importBtn">⬆ Import</button>
      <input type="file" id="importFile" accept=".json" class="hidden">
      <button class="btn-b" id="resetBtn">↺ Reset</button>
      <button class="btn-b" id="logoutBtn">Sortie</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="abody" id="formBody"></div>
  <div style="padding:0 1.4rem 1.4rem;display:flex;gap:.6rem;flex-wrap:wrap">
    <button class="btn-a" id="saveBtn">💾 Enregistrer tout</button>
    <small class="hint">Sauvegarde locale instantanée — visible sur le site dès refresh.</small>
  </div>
</div>
</div>

<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
